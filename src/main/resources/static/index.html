<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>千问文本转语音</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f1ea;
            color: #2b241c;
            font-family: "PingFang SC", "Noto Sans SC", sans-serif;
        }
        main {
            width: min(720px, calc(100% - 32px));
            padding: 28px;
            background: #fffdf8;
            border: 1px solid #e6dcc8;
            border-radius: 18px;
        }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { margin: 0 0 20px; color: #6d6256; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        textarea, select {
            width: 100%;
            border: 1px solid #d9cdb8;
            border-radius: 12px;
            padding: 12px 14px;
            font: inherit;
            background: #fff;
        }
        textarea { min-height: 160px; resize: vertical; }
        .voice { margin-top: 16px; }
        button {
            margin-top: 18px;
            border: 0;
            border-radius: 999px;
            padding: 12px 22px;
            background: #8c4b16;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        audio { width: 100%; margin-top: 18px; }
        .error { margin-top: 14px; color: #9d1c1c; }
    </style>
</head>
<body>
<main>
    <h1>千问文本转语音</h1>
    <p>输入文字后点击按钮，服务端会调用本机 9000 端口的 mlx-audio 并播放语音。</p>
    <label for="text">文本</label>
    <textarea id="text">你好，我是龙宝。请介绍一下这件文物。</textarea>
    <div class="voice">
        <label for="voice">音色</label>
        <select id="voice">
            <option value="vivian" selected>Vivian · 女声</option>
            <option value="serena">Serena · 女声</option>
            <option value="uncle_fu">Uncle_Fu · 男声</option>
            <option value="ryan">Ryan · 男声</option>
            <option value="aiden">Aiden · 男声</option>
            <option value="dylan">Dylan · 北京话男声</option>
            <option value="eric">Eric · 四川话男声</option>
            <option value="ono_anna">Ono_Anna · 日语女声</option>
            <option value="sohee">Sohee · 韩语女声</option>
        </select>
    </div>
    <button id="speak" type="button">转语音</button>
    <audio id="player" controls hidden></audio>
    <div id="error" class="error"></div>
</main>
<script>
    const button = document.querySelector("#speak");
    const player = document.querySelector("#player");
    const error = document.querySelector("#error");

    button.addEventListener("click", async () => {
        const text = document.querySelector("#text").value.trim();
        const voice = document.querySelector("#voice").value.trim();
        error.textContent = "";
        if (!text) {
            error.textContent = "请输入要转换的文字";
            return;
        }
        button.disabled = true;
        button.textContent = "转换中...";
        try {
            const response = await fetch("/api/tts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text, voice })
            });
            if (!response.ok) {
                const result = await response.json().catch(() => ({}));
                throw new Error(result.message || "文本转语音失败");
            }
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            player.hidden = false;
            player.src = url;
            await player.play();
        } catch (ex) {
            error.textContent = ex.message;
        } finally {
            button.disabled = false;
            button.textContent = "转语音";
        }
    });
</script>
</body>
</html>
